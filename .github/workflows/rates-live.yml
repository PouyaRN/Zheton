name: rates-live

on:
  schedule:
    - cron: "*/15 * * * *"
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 22
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install PWA dependencies and build static site
        working-directory: pwa
        run: |
          npm install
          npm run build

      - name: Test rates-pipeline
        working-directory: rates-pipeline
        run: |
          npm install
          npm run typecheck
          npm test

      - name: Fetch, validate, sign, and emit live rates into PWA dist
        working-directory: rates-pipeline
        env:
          RATES_SIGNING_KEY: ${{ secrets.RATES_SIGNING_KEY }}
        run: |
          node --experimental-strip-types src/build.ts --out-dir ../pwa/dist --daily

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: pwa/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

