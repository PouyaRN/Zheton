name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.2.0)'
        required: true
        default: 'v1.2.0'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Verify and recreate permanent signing config
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          umask 077
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Permanent release signing secrets (KEYSTORE_B64, KEYSTORE_STORE_PASSWORD, KEYSTORE_KEY_ALIAS, KEYSTORE_KEY_PASSWORD) are required."
            exit 1
          fi
          printf '%s' "$KEYSTORE_B64" | base64 -d > zheton-release.jks
          cat > keystore.properties <<EOF
          storeFile=zheton-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Run unit tests and assemble release APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleRelease \
            -Pzheton.versionName=${RELEASE_TAG#v} \
            -Pmuchtoman.versionName=${RELEASE_TAG#v}

      - name: Remove signing material
        if: always()
        run: rm -f zheton-release.jks keystore.properties

      - name: Prepare release artifacts and SHA256SUMS
        run: |
          prev=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
          : > notes.md
          fa=$(git tag -l --format='%(contents:subject)%0a%(contents:body)' "${RELEASE_TAG}")
          if [ -n "$(printf '%s' "$fa" | tr -d '[:space:]')" ]; then
            { echo '<!--fa-->'; printf '%s\n' "$fa"; echo '<!--/fa-->'; echo; } >> notes.md
          fi
          echo "## Changes" >> notes.md
          git log --no-merges --reverse --pretty='- %s' "${prev:+$prev..}${RELEASE_TAG}" >> notes.md
          if [ -n "$prev" ]; then
            echo >> notes.md
            echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$prev...$RELEASE_TAG" >> notes.md
          fi

          mv app/build/outputs/apk/release/app-release.apk \
             zheton-${RELEASE_TAG}.apk
          touch zheton-${RELEASE_TAG}-mapping.txt
          [ -f app/build/outputs/mapping/release/mapping.txt ] && cp app/build/outputs/mapping/release/mapping.txt zheton-${RELEASE_TAG}-mapping.txt || true
          sha256sum "zheton-${RELEASE_TAG}.apk" > SHA256SUMS
          {
            echo
            echo "### SHA-256 Checksum"
            echo '```'
            cat SHA256SUMS
            echo '```'
          } >> notes.md

      - name: Attest APK build provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517eb71b # v2.2.3
        continue-on-error: true
        with:
          subject-path: zheton-${{ env.RELEASE_TAG }}.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            zheton-${{ env.RELEASE_TAG }}.apk
            zheton-${{ env.RELEASE_TAG }}-mapping.txt
            SHA256SUMS
            notes.md
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
      - run: |
          gh release create "$RELEASE_TAG" \
            "zheton-${RELEASE_TAG}.apk" \
            "zheton-${RELEASE_TAG}-mapping.txt" \
            "SHA256SUMS" \
            --notes-file notes.md --title "ژتون $RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" || \
          gh release upload "$RELEASE_TAG" \
            "zheton-${RELEASE_TAG}.apk" \
            "zheton-${RELEASE_TAG}-mapping.txt" \
            "SHA256SUMS" \
            --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
