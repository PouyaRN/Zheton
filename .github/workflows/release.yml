name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: Recreate signing config
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          umask 077
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > zheton-release.jks
            cat > keystore.properties <<EOF
          storeFile=zheton-release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          else
            keytool -genkeypair -noprompt \
              -keystore zheton-release.jks -storepass zheton2026 -keypass zheton2026 \
              -alias zheton -dname "CN=Zheton, OU=Mobile, O=Zheton, C=IR" -keyalg RSA -keysize 2048 -validity 10000
            cat > keystore.properties <<EOF
          storeFile=zheton-release.jks
          storePassword=zheton2026
          keyAlias=zheton
          keyPassword=zheton2026
          EOF
          fi

      - name: Run unit tests and assemble release APK
        run: |
          ./gradlew testDebugUnitTest assembleRelease \
            -Pmuchtoman.versionName=${RELEASE_TAG#v}

      - name: Remove signing material
        if: always()
        run: rm -f zheton-release.jks keystore.properties

      - name: Prepare release artifacts
        run: |
          prev=$(git describe --tags --abbrev=0 "${RELEASE_TAG}^" 2>/dev/null || true)
          : > notes.md
          fa=$(git tag -l --format='%(contents:subject)%0a%(contents:body)' "${RELEASE_TAG}")
          if [ -n "$(printf '%s' "$fa" | tr -d '[:space:]')" ]; then
            { echo '<!--fa-->'; printf '%s\n' "$fa"; echo '<!--/fa-->'; echo; } >> notes.md
          fi
          echo "## Changes" >> notes.md
          git log --no-merges --reverse --pretty='- %s' "${prev:+$prev..}${RELEASE_TAG}" >> notes.md
          if [ -n "$prev" ]; then
            echo >> notes.md
            echo "**Full changelog:** https://github.com/$GITHUB_REPOSITORY/compare/$prev...$RELEASE_TAG" >> notes.md
          fi
          cat notes.md

          mv app/build/outputs/apk/release/app-release.apk \
             zheton-${RELEASE_TAG}.apk
          touch zheton-${RELEASE_TAG}-mapping.txt
          [ -f app/build/outputs/mapping/release/mapping.txt ] && cp app/build/outputs/mapping/release/mapping.txt zheton-${RELEASE_TAG}-mapping.txt || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-artifacts
          path: |
            zheton-${{ env.RELEASE_TAG }}.apk
            notes.md
          if-no-files-found: warn
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-artifacts
      - run: |
          gh release create "$RELEASE_TAG" "zheton-${RELEASE_TAG}.apk" \
            --notes-file notes.md --title "ژتون $RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" || \
          gh release upload "$RELEASE_TAG" "zheton-${RELEASE_TAG}.apk" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
