name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks across working tree and recent commits
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 \
            detect --source /repo --log-opts="9a0256d..HEAD" --redact --no-banner -c /repo/.gitleaks.toml
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.0 \
            detect --no-git --source /repo --redact --no-banner -c /repo/.gitleaks.toml

  workflow-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  npm-audit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [pwa, worker, sync]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Audit production dependencies (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: |
          npm install --no-audit
          npm audit --omit=dev --audit-level=high

  android-security-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.0.0
      - name: Run Android security and hygiene tests
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest \
            --tests "com.doxigo.muchtoman.ManifestSecurityTest" \
            --tests "com.doxigo.muchtoman.BackupRulesTest" \
            --tests "com.doxigo.muchtoman.NoSensitiveLogTest" \
            --tests "com.doxigo.muchtoman.DeepLinkValidationTest" \
            --tests "com.doxigo.muchtoman.RepoHygieneTest" \
            --tests "com.doxigo.muchtoman.LicenseNoticeTest"
