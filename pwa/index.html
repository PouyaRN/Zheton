<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- The top of the page is the top of the hero field, so this is `Hero.top`, not the bottom
         of its gradient — a browser chrome in the darker green read as a seam across the field. -->
    <meta name="theme-color" content="#0C544A" />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Blocking, and worth it: the whole page is figures, and a fallback face swapping out from
         under a Toman total is the one reflow that changes what the number looks like. -->
    <link rel="preload" href="/modam.woff2" as="font" type="font/woff2" crossorigin />
    <!-- Web Push on iOS only works once this is on the Home Screen, so say so in the app. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Andis</title>
    <meta
      name="description"
      content="اندیس؛ دفتر خرج خانواده و ماشین‌حساب‌های مالی فارسی، بدون حساب کاربری و بدون تلهمتری."
    />
    <link rel="canonical" href="https://sync.muchtoman.com/" />
  </head>
  <body>
    <main id="app">
      <p class="page muted">داره آماده می‌شه...</p>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
