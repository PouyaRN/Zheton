<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>طلای ۱۸ عیار · اندیس</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5B840;text-decoration:none}a:hover{color:#FFD27A}
button{font-family:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #000000; color: #F5F5F4; font-family: 'Vazirmatn', system-ui, sans-serif">

  <div aria-hidden="true" style="position: absolute; top: 160px; right: -100px; width: 600px; height: 460px; border-radius: 999px; background: radial-gradient(closest-side, rgba(245,184,64,0.20), rgba(0,0,0,0) 100%)"></div>

  <div style="position: relative; padding: 58px 0 0; display: flex; flex-direction: column">

    <div style="padding: 0 20px; display: flex; align-items: center; gap: 10px">
      <a href="Market.dc.html" aria-label="بازگشت" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); color: #F5F5F4; display: flex; align-items: center; justify-content: center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
      </a>
      <div style="flex: 1; display: flex; align-items: center; gap: 10px">
        <span style="width: 36px; height: 36px; border-radius: 999px; background: #1C1608; color: #F5B840; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center">۱۸</span>
        <div style="display: flex; flex-direction: column; line-height: 1.3"><span style="font-size: 15px; font-weight: 700">طلای ۱۸ عیار</span><span style="font-size: 11px; color: #8E8E93">هر گرم · بازار آزاد</span></div>
      </div>
      <button aria-label="هشدار قیمت" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); background: transparent; color: #F5F5F4; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15z"></path><path d="M10 20.5a2 2 0 0 0 4 0"></path></svg>
      </button>
    </div>

    <div style="padding: 26px 20px 0; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 52px; font-weight: 800; line-height: 1.05; letter-spacing: -1.5px">۲٬۵۵۰٬۰۰۰</span>
      <span style="font-size: 14px; font-weight: 700; color: {{tone}}">{{delta}} <span style="font-weight: 500; color: #8E8E93">{{span}}</span></span>
    </div>

    <!-- Full-bleed chart; your own average buy price drawn across it -->
    <div style="position: relative; margin-top: 16px">
      <svg dir="ltr" width="390" height="230" viewBox="0 0 390 230" role="img" aria-label="نمودار قیمت طلای ۱۸ عیار؛ قیمت فعلی بالای میانگین قیمت خریدته">
        <defs>
          <linearGradient id="goldFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#F5B840" stop-opacity="0.42"></stop>
            <stop offset="0.7" stop-color="#F5B840" stop-opacity="0.06"></stop>
            <stop offset="1" stop-color="#F5B840" stop-opacity="0"></stop>
          </linearGradient>
        </defs>
        <line x1="0" y1="{{costY}}" x2="390" y2="{{costY}}" stroke="rgba(255,255,255,0.35)" stroke-width="1" stroke-dasharray="4 5"></line>
        <path d="{{fill}}" fill="url(#goldFill)"></path>
        <path d="{{line}}" stroke="#F5B840" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
        <line x1="{{scrubX}}" y1="12" x2="{{scrubX}}" y2="218" stroke="rgba(255,255,255,0.45)" stroke-width="1"></line>
        <circle cx="{{scrubX}}" cy="{{scrubY}}" r="10" fill="#F5B840" fill-opacity="0.2"></circle>
        <circle cx="{{scrubX}}" cy="{{scrubY}}" r="5" fill="#F5B840" stroke="#000" stroke-width="2"></circle>
        <circle cx="{{endX}}" cy="{{endY}}" r="4" fill="#F5F5F4"></circle>
      </svg>
      <div style="position: absolute; top: 0; left: {{bubbleLeft}}; background: #F5F5F4; color: #000; border-radius: 12px; padding: 5px 10px; display: flex; flex-direction: column; align-items: center; line-height: 1.3">
        <span style="font-size: 12px; font-weight: 800">{{scrubPrice}}</span>
        <span style="font-size: 10px; color: #3A3A3F">{{scrubDate}}</span>
      </div>
      <span style="position: absolute; top: {{costLabelTop}}; right: 20px; font-size: 10px; color: #000; background: rgba(245,245,244,0.9); padding: 1px 8px; border-radius: 999px">میانگین قیمت خریدت ۲٬۱۸۰٬۰۰۰</span>
    </div>

    <div role="tablist" aria-label="بازهٔ زمانی" style="margin: 8px 20px 0; display: flex; justify-content: space-between; padding: 3px; border-radius: 999px; background: #0F0F11; border: 1px solid rgba(255,255,255,0.07)">
      <sc-for list="{{periods}}" as="p" hint-placeholder-count="5">
        <button role="tab" aria-selected="{{p.on}}" onClick="{{p.pick}}" style="flex: 1; height: 36px; border: 0; border-radius: 999px; background: {{p.bg}}; color: {{p.fg}}; font-size: 13px; font-weight: 700; cursor: pointer">{{p.label}}</button>
      </sc-for>
    </div>

    <!-- What it means for you -->
    <div style="margin: 16px 20px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="background: #0F0F11; border: 1px solid rgba(255,255,255,0.07); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #8E8E93">طلای تو</span>
        <span style="font-size: 19px; font-weight: 800">۳۰٫۶ میلیون</span>
        <span style="font-size: 11px; color: #8E8E93">۱۲ گرم</span>
      </div>
      <div style="background: #0F0F11; border: 1px solid rgba(255,255,255,0.07); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #8E8E93">سود تا امروز</span>
        <span style="font-size: 19px; font-weight: 800; color: #3FD98B">+۴٫۴ میلیون</span>
        <span style="font-size: 11px; color: #8E8E93">+۱۷٪ نسبت به قیمت خرید</span>
      </div>
    </div>

    <div style="margin: 14px 20px 0; display: flex; gap: 8px">
      <button style="flex: 1; height: 56px; border: 0; border-radius: 999px; background: #F5F5F4; color: #000; font-size: 15px; font-weight: 800; cursor: pointer">ثبت خرید</button>
      <button style="flex: 1; height: 56px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.2); background: transparent; color: #F5F5F4; font-size: 15px; font-weight: 700; cursor: pointer">ثبت فروش</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { period: 1 };
  }

  series(seed, n, drift, wave) {
    const pts = [];
    for (let i = 0; i < n; i++) {
      const t = i / (n - 1);
      const v = 0.5 + drift * (t - 0.5)
        + wave * Math.sin(t * 9 + seed) * 0.5
        + 0.035 * Math.sin(t * 31 + seed * 2)
        + 0.02 * Math.sin(t * 57 + seed * 3);
      pts.push(v);
    }
    return pts;
  }

  smooth(points) {
    let d = 'M' + points[0][0].toFixed(1) + ' ' + points[0][1].toFixed(1);
    for (let i = 0; i < points.length - 1; i++) {
      const p0 = points[i - 1] || points[i];
      const p1 = points[i];
      const p2 = points[i + 1];
      const p3 = points[i + 2] || p2;
      const c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      const c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ' C' + c1x.toFixed(1) + ' ' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ' ' + c2y.toFixed(1) + ' ' + p2[0].toFixed(1) + ' ' + p2[1].toFixed(1);
    }
    return d;
  }

  renderVals() {
    const labels = ['هفته', 'ماه', '۳ ماه', 'سال', '۵ سال'];
    const spec = [
      { seed: 1.2, drift: 0.25, wave: 0.18, delta: '+۳۸٬۰۰۰ (۱٫۵٪)', span: 'در این هفته', date: '۳ آبان', price: '۲٬۵۲۰٬۰۰۰' },
      { seed: 2.4, drift: 0.55, wave: 0.16, delta: '+۱۰۰٬۰۰۰ (۴٫۱٪)', span: 'در این ماه', date: '۱۸ مهر', price: '۲٬۴۳۰٬۰۰۰' },
      { seed: 0.7, drift: 0.7, wave: 0.2, delta: '+۲۹۰٬۰۰۰ (۱۲٫۸٪)', span: 'در ۳ ماه گذشته', date: '۲ شهریور', price: '۲٬۳۱۰٬۰۰۰' },
      { seed: 3.1, drift: 0.85, wave: 0.14, delta: '+۸۷۰٬۰۰۰ (۵۱٪)', span: 'در یک سال گذشته', date: 'اسفند ۱۴۰۴', price: '۲٬۰۴۰٬۰۰۰' },
      { seed: 4.0, drift: 1.1, wave: 0.1, delta: '+۱٬۹۲۰٬۰۰۰ (۳۰۴٪)', span: 'در ۵ سال گذشته', date: '۱۴۰۲', price: '۱٬۲۰۰٬۰۰۰' },
    ];
    const p = this.state.period;
    const s = spec[p];
    const raw = this.series(s.seed, 48, s.drift, s.wave);
    const min = Math.min(...raw), max = Math.max(...raw);
    const top = 34, bottom = 210, W = 390;
    const pts = raw.map((v, i) => [i * (W / (raw.length - 1)), bottom - ((v - min) / (max - min)) * (bottom - top)]);
    const line = this.smooth(pts);
    const fill = line + ' L' + W + ' 230 L0 230 Z';
    const si = Math.round(raw.length * 0.62);
    const scrubX = pts[si][0], scrubY = pts[si][1];
    const costY = Math.round(bottom - 0.32 * (bottom - top));
    const end = pts[pts.length - 1];
    const periods = labels.map((label, i) => ({
      label,
      on: i === p ? 'true' : 'false',
      bg: i === p ? '#F5F5F4' : 'transparent',
      fg: i === p ? '#000000' : '#8E8E93',
      pick: () => this.setState({ period: i }),
    }));
    return {
      line, fill, periods,
      scrubX: scrubX.toFixed(1), scrubY: scrubY.toFixed(1),
      endX: end[0].toFixed(1), endY: end[1].toFixed(1),
      bubbleLeft: Math.max(8, Math.min(290, scrubX - 46)) + 'px',
      costY, costLabelTop: (costY - 20) + 'px',
      delta: s.delta, span: s.span, tone: '#3FD98B',
      scrubDate: s.date, scrubPrice: s.price,
    };
  }
}
</script>
</body>
</html>
