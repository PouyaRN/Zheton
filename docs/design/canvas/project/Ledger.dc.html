<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>دفتر · اندیس</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5B840;text-decoration:none}a:hover{color:#FFD27A}
button,input{font-family:inherit}
input::placeholder{color:#8E8E93}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #000000; color: #F5F5F4; font-family: 'Vazirmatn', system-ui, sans-serif">
  <div style="position: relative; padding: 58px 20px 0; display: flex; flex-direction: column; gap: 18px">

    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #8E8E93">آبان ۱۴۰۵ · ۴۸ تراکنش</span>
        <h1 style="margin: 0; font-size: 40px; line-height: 1.1; font-weight: 800; letter-spacing: -0.5px">دفتر</h1>
      </div>
      <div style="display: flex; gap: 8px">
        <button aria-label="جست‌وجو" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #F5F5F4; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        </button>
        <button aria-label="فیلتر" style="width: 44px; height: 44px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.12); background: rgba(255,255,255,0.04); color: #F5F5F4; display: flex; align-items: center; justify-content: center; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
        </button>
      </div>
    </div>

    <!-- This week, as seven bars -->
    <div style="background: #0F0F11; border: 1px solid rgba(255,255,255,0.07); border-radius: 26px; padding: 18px 16px 14px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <div style="display: flex; flex-direction: column">
          <span style="font-size: 12px; color: #8E8E93">خرج این هفته</span>
          <span style="font-size: 26px; font-weight: 800">۱٫۴ <span style="font-size: 13px; font-weight: 600; color: #8E8E93">میلیون</span></span>
        </div>
        <span style="font-size: 11px; font-weight: 700; color: #3FD98B; background: rgba(63,217,139,0.12); padding: 3px 9px; border-radius: 999px">۱۲٪ کمتر از همین موقع هفتهٔ پیش</span>
      </div>
      <div role="img" aria-label="خرج روزانهٔ این هفته تا امروز سه‌شنبه؛ امروز ۲۷۷ هزار تومان" style="display: flex; align-items: flex-end; gap: 10px; height: 104px">
        <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
          <div style="flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px">
            <sc-if value="{{d.peak}}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 11px; font-weight: 600; color: #F5B840; white-space: nowrap">{{d.label}}</span>
            </sc-if>
            <div style="width: 100%; border-radius: 10px; height: {{d.h}}; background: {{d.c}}"></div>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; gap: 10px">
        <sc-for list="{{week}}" as="d" hint-placeholder-count="7">
          <span style="flex: 1; text-align: center; font-size: 11px; color: {{d.tc}}">{{d.day}}</span>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; gap: 8px">
      <button aria-pressed="true" style="height: 36px; padding: 0 14px; border: 0; border-radius: 999px; background: #F5F5F4; color: #000; font-size: 13px; font-weight: 800">همه</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 12px 0 8px; border: 0; border-radius: 999px; background: #1C1608; color: #F5B840; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 6px">دسته‌بندی‌نشده <span style="min-width: 20px; height: 20px; border-radius: 999px; background: #F5B840; color: #000; font-size: 11px; display: flex; align-items: center; justify-content: center">۴</span></button>
      <button aria-pressed="false" style="height: 36px; padding: 0 14px; border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; background: transparent; color: #D4D4D6; font-size: 13px">واریزها</button>
      <button aria-pressed="false" style="height: 36px; padding: 0 14px; border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; background: transparent; color: #D4D4D6; font-size: 13px">قسط‌ها</button>
    </div>

    <div style="display: flex; flex-direction: column">
      <div style="display: flex; justify-content: space-between; font-size: 12px; padding: 2px 2px 4px; color: #8E8E93">
        <span style="font-weight: 700; color: #F5F5F4">امروز</span>
        <span>−۲۷۷٬۰۰۰</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0">
          <span style="width: 44px; height: 44px; border-radius: 999px; background: {{r.bg}}; color: {{r.fg}}; display: flex; align-items: center; justify-content: center">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.icon}}"></path></svg>
          </span>
          <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.4">
            <span style="font-size: 15px; font-weight: 600">{{r.name}}</span>
            <span style="font-size: 12px; color: {{r.subc}}">{{r.sub}}</span>
          </div>
          <span style="font-size: 15px; font-weight: 700; color: {{r.ac}}">{{r.amount}}</span>
        </div>
      </sc-for>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; right: 0; left: 0; bottom: 0; height: 150px; background: linear-gradient(to top, #000 45%, rgba(0,0,0,0))"></div>

  <nav aria-label="ناوبری اصلی" style="position: absolute; right: 20px; left: 20px; bottom: 28px; height: 66px; border-radius: 999px; background: rgba(28,28,30,0.86); border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: space-between; padding: 0 7px">
    <a href="Main.dc.html" aria-label="امروز" style="width: 52px; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #8E8E93">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20H4z"></path></svg>
    </a>
    <a href="Ledger.dc.html" aria-current="page" style="height: 52px; padding: 0 18px; border-radius: 999px; background: #F5F5F4; color: #000; display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h4"></path></svg>
      دفتر
    </a>
    <a href="Market.dc.html" aria-label="دارایی" style="width: 52px; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #8E8E93">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l5-6 4 3 7-8"></path></svg>
    </a>
    <a href="Accounts.dc.html" aria-label="حساب‌ها" style="width: 52px; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #8E8E93">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18"></path></svg>
    </a>
    <a href="Report.dc.html" aria-label="گزارش" style="width: 52px; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #8E8E93">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 19V11M12 19V5M18 19v-6"></path></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // Thousands of toman, Saturday to Friday; today is Tuesday and the days after it have not happened.
    const vals = [420, 180, 550, 277, 0, 0, 0];
    const days = ['ش', 'ی', 'د', 'س', 'چ', 'پ', 'ج'];
    const max = 550;
    const today = 3;
    console.assert(vals.reduce((a, b) => a + b, 0) === 1427, 'week total shown as 1.4 m');
    const week = vals.map((v, i) => ({
      h: (i > today ? 4 : Math.max(6, Math.round((v / max) * 72))) + 'px',
      c: i === today ? '#F5B840' : (i > today ? '#1A1A1D' : '#3A3A3F'),
      peak: i === today,
      label: '۲۷۷ هزار',
      day: days[i],
      tc: i === today ? '#F5F5F4' : '#8E8E93',
    }));
    const cup = 'M5 9h11v5a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5zM16 10h2a2 2 0 0 1 0 4h-2';
    const car = 'M5 17h14M6 17l1.5-5.5A2 2 0 0 1 9.4 10h5.2a2 2 0 0 1 1.9 1.5L18 17';
    const q = 'M12 8v5M12 16v.01M12 4a8 8 0 1 0 0 16a8 8 0 1 0 0-16';
    const inA = 'M17 7L7 17M7 9v8h8';
    const rows = [
      { name: 'کافه لمیز', sub: 'کافه · ملت · ۱۰:۴۲', subc: '#8E8E93', amount: '−۱۸۵٬۰۰۰', ac: '#F5F5F4', icon: cup, bg: '#1C1608', fg: '#F5B840' },
      { name: 'اسنپ', sub: 'حمل‌ونقل · سامان · ۰۸:۱۵', subc: '#8E8E93', amount: '−۹۲٬۰۰۰', ac: '#F5F5F4', icon: car, bg: '#161618', fg: '#F5F5F4' },
      { name: 'خرید کارت‌خوان', sub: 'هنوز دسته‌بندی نشده', subc: '#F5B840', amount: '−۱٬۲۰۰٬۰۰۰', ac: '#F5F5F4', icon: q, bg: '#161618', fg: '#F5B840' },
      { name: 'واریز از علی رضایی', sub: 'واریز · ملت · ۰۷:۰۳', subc: '#8E8E93', amount: '+۱٬۲۰۰٬۰۰۰', ac: '#3FD98B', icon: inA, bg: '#0D2218', fg: '#3FD98B' },
    ];
    return { week, rows };
  }
}
</script>
</body>
</html>
