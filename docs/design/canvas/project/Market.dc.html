<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<title>دارایی · اندیس</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#F5B840;text-decoration:none}a:hover{color:#FFD27A}
button{font-family:inherit}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #000000; color: #F5F5F4; font-family: 'Vazirmatn', system-ui, sans-serif">

  <div aria-hidden="true" style="position: absolute; top: 60px; right: -60px; width: 520px; height: 520px; border-radius: 999px; background: radial-gradient(closest-side, rgba(245,184,64,0.18), rgba(0,0,0,0) 100%)"></div>

  <div style="position: relative; padding: 58px 20px 0; display: flex; flex-direction: column; gap: 16px">

    <div style="display: flex; align-items: flex-end; justify-content: space-between">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 11px; color: #B5B5B8; display: flex; align-items: center; gap: 6px"><span style="width: 6px; height: 6px; border-radius: 999px; background: #3FD98B"></span>نرخ‌ها ۲ دقیقه پیش به‌روز شد</span>
        <h1 style="margin: 0; font-size: 40px; line-height: 1.1; font-weight: 800; letter-spacing: -0.5px">دارایی</h1>
      </div>
      <div role="tablist" aria-label="نمایش" style="display: flex; padding: 3px; border-radius: 999px; background: #121214; border: 1px solid rgba(255,255,255,0.07)">
        <button role="tab" aria-selected="true" style="height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: #F5F5F4; color: #000; font-size: 12px; font-weight: 800">دارایی‌های من</button>
        <button role="tab" aria-selected="false" style="height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: transparent; color: #8E8E93; font-size: 12px; font-weight: 600">همهٔ نرخ‌ها</button>
      </div>
    </div>

    <!-- Ring: what it is made of, around how much it is -->
    <div style="position: relative; height: 230px; display: flex; align-items: center; justify-content: center">
      <svg width="220" height="220" viewBox="0 0 220 220" role="img" aria-label="ترکیب دارایی: طلا ۵۹٪، سکه ۲۵٪، دلار ۱۲٪، تتر ۴٪">
        <circle cx="110" cy="110" r="80" fill="none" stroke="#141416" stroke-width="18"></circle>
        <g transform="rotate(-90 110 110)">
          <circle cx="110" cy="110" r="80" fill="none" stroke="#F5B840" stroke-width="18" stroke-linecap="round" stroke-dasharray="284.6 218.05" stroke-dashoffset="-2"></circle>
          <circle cx="110" cy="110" r="80" fill="none" stroke="#B8752A" stroke-width="18" stroke-linecap="round" stroke-dasharray="113.7 388.95" stroke-dashoffset="-298.6"></circle>
          <circle cx="110" cy="110" r="80" fill="none" stroke="#7FB2FF" stroke-width="18" stroke-linecap="round" stroke-dasharray="48.3 454.35" stroke-dashoffset="-424.3"></circle>
          <circle cx="110" cy="110" r="80" fill="none" stroke="#3FD98B" stroke-width="18" stroke-linecap="round" stroke-dasharray="8.1 494.55" stroke-dashoffset="-484.6"></circle>
        </g>
      </svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px">
        <span style="font-size: 11px; color: #8E8E93">ارزش امروز</span>
        <span style="font-size: 34px; font-weight: 800; line-height: 1.1">۵۲٫۰</span>
        <span style="font-size: 12px; color: #8E8E93">میلیون تومان</span>
        <span style="margin-top: 4px; font-size: 11px; font-weight: 700; color: #3FD98B; background: rgba(63,217,139,0.12); padding: 2px 8px; border-radius: 999px">+۳٫۴٪ نسبت به دیروز</span>
      </div>
    </div>

    <div style="display: flex; justify-content: center; gap: 14px; font-size: 12px; color: #B5B5B8">
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #F5B840"></span>طلا</span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #B8752A"></span>سکه</span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #7FB2FF"></span>دلار</span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 999px; background: #3FD98B"></span>تتر</span>
    </div>

    <div style="display: flex; flex-direction: column">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <a href="{{r.href}}" style="display: flex; align-items: center; gap: 12px; padding: 11px 0; color: #F5F5F4; border-bottom: 1px solid rgba(255,255,255,0.06)">
          <span style="width: 44px; height: 44px; border-radius: 999px; background: {{r.bg}}; color: {{r.fg}}; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center">{{r.mark}}</span>
          <div style="flex: 1; display: flex; flex-direction: column; line-height: 1.4">
            <span style="font-size: 15px; font-weight: 600">{{r.name}}</span>
            <span style="font-size: 12px; color: #8E8E93">{{r.held}}</span>
          </div>
          <svg width="56" height="26" viewBox="0 0 56 26" aria-hidden="true"><path d="{{r.spark}}" stroke="{{r.tone}}" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"></path></svg>
          <div style="width: 96px; display: flex; flex-direction: column; align-items: flex-end; line-height: 1.4">
            <span style="font-size: 15px; font-weight: 700">{{r.value}}</span>
            <span style="font-size: 12px; font-weight: 700; color: {{r.tone}}">{{r.change}}</span>
          </div>
        </a>
      </sc-for>
    </div>
  </div>

  <div aria-hidden="true" style="position: absolute; right: 0; left: 0; bottom: 0; height: 150px; background: linear-gradient(to top, #000 45%, rgba(0,0,0,0))"></div>

  <nav aria-label="ناوبری اصلی" style="position: absolute; right: 20px; left: 20px; bottom: 28px; height: 66px; border-radius: 999px; background: rgba(28,28,30,0.86); border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center; justify-content: space-between; padding: 0 7px">
    <a href="Main.dc.html" aria-label="امروز" style="width: 52px; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #8E8E93">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5L12 4l8 6.5V20H4z"></path></svg>
    </a>
    <a href="Ledger.dc.html" aria-label="دفتر" style="width: 52px; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #8E8E93">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h4"></path></svg>
    </a>
    <a href="Market.dc.html" aria-current="page" style="height: 52px; padding: 0 18px; border-radius: 999px; background: #F5F5F4; color: #000; display: flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 800">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 18l5-6 4 3 7-8"></path></svg>
      دارایی
    </a>
    <a href="Accounts.dc.html" aria-label="حساب‌ها" style="width: 52px; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #8E8E93">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="3"></rect><path d="M3 10h18"></path></svg>
    </a>
    <a href="Report.dc.html" aria-label="گزارش" style="width: 52px; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; color: #8E8E93">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M6 19V11M12 19V5M18 19v-6"></path></svg>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const up = '#3FD98B', down = '#FF7B6B', flat = '#8E8E93';
    const rows = [
      { href: 'Asset.dc.html', mark: '۱۸', bg: '#1C1608', fg: '#F5B840', name: 'طلای ۱۸ عیار', held: '۱۲ گرم', value: '۳۰٫۶ میلیون', change: '+۴٫۱٪', tone: up, spark: 'M1 21 C8 20 12 17 18 18 C25 19 28 12 34 12 C40 12 44 7 55 4' },
      { href: 'Asset.dc.html', mark: 'س', bg: '#1E140A', fg: '#D89A4E', name: 'سکه امامی', held: '۱ عدد', value: '۱۲٫۸ میلیون', change: '+۲٫۶٪', tone: up, spark: 'M1 18 C8 19 12 15 18 16 C25 17 30 12 36 13 C42 14 46 9 55 8' },
      { href: 'Asset.dc.html', mark: '$', bg: '#0E1A2E', fg: '#7FB2FF', name: 'دلار آمریکا', held: '۵۸ دلار', value: '۶٫۱ میلیون', change: '−۰٫۸٪', tone: down, spark: 'M1 6 C8 7 12 9 18 9 C25 9 30 13 36 13 C42 13 46 16 55 18' },
      { href: 'Asset.dc.html', mark: '₮', bg: '#0D2218', fg: '#3FD98B', name: 'تتر', held: '۲۴ تتر · کیف‌پول', value: '۲٫۵ میلیون', change: '۰٫۰٪', tone: flat, spark: 'M1 13 C10 12 16 14 24 13 C32 12 40 14 55 13' },
    ];
    return { rows };
  }
}
</script>
</body>
</html>
