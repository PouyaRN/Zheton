title = "zheton-gitleaks-config"

[extend]
useDefault = true

[[rules]]
id = "ir-mobile-number-personal"
description = "Iranian personal mobile number (091x, 092x, 093x, 099x excluding 099999 bank gateways)"
regex = '''(?:\+98|0098|0)9(?:1\d|2\d|3\d|9[0-8])\d{7}\b'''
tags = ["pii", "iran"]

[allowlist]
description = "Public bank SMS sender numbers, synthetic test fixtures, UI placeholders, and lockfiles"
paths = [
  '''app/src/main/java/com/doxigo/muchtoman/Sms\.kt''',
  '''app/src/main/java/com/doxigo/muchtoman/ui/cards/CardEditorSheet\.kt''',
  '''app/src/test/.*''',
  '''pwa/src/services/storageService\.ts''',
  '''pwa/src/utils/__tests__/.*''',
  '''pwa/test/.*''',
  '''pwa/cypress/.*''',
  '''rates-pipeline/.*''',
  '''docs/.*''',
  '''package-lock\.json''',
]
